<!doctype html>
<html lang="en" data-bg="{{ site.background | default: 'paper' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="ethAddress" content="0x75D5D81DBab1e62A212b3D15191D0338288BC164">
    <meta name="ethTip" content=".005"/>
    <title>{{ page.title }}</title>
    <!-- Temporary: preview background palettes with ?bg=paper|sepia|fog|blush|sage -->
    <script>
        (function() {
            var bg = new URLSearchParams(location.search).get('bg');
            if (bg) document.documentElement.setAttribute('data-bg', bg);
        })();
    </script>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="https://bthdonohue.com/ethTip/ethtip.css"/>
    <link rel="stylesheet" href="/css/highlight.min.css">
    <link rel="stylesheet" href="/css/bigfoot.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="alternate" type="application/atom+xml" href="/feed.xml">
    <script src="/js/jquery-1.11.0.min.js"></script>
    <script src="/js/bigfoot.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="https://bthdonohue.com/ethTip/ethtip.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-132555961-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'UA-132555961-1');
        hljs.initHighlightingOnLoad();
        $.bigfoot();
    </script>
  </head>
  <body>
    <header class="site-header">
        <a href="/" class="site-name"><img class="avatar" src="/img/brian.png" alt="">Brian Donohue</a>
        <nav class="site-nav">
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </nav>
    </header>
    <main>
        {{ content }}
    </main>
    <button id="ethTip"></button>
    <script>
        (function() {
            var root = document.documentElement;
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            document.querySelector('.theme-toggle').addEventListener('click', function() {
                var isDark = root.getAttribute('data-theme')
                    ? root.getAttribute('data-theme') === 'dark'
                    : media.matches;
                var next = isDark ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) {}
            });
        })();
    </script>
  </body>
</html>
