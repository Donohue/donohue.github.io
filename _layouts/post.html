---
layout: default
---
<article class="post article h-entry" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {%- assign date_format = site.minima.date_format | default: "%b %-d, %Y" -%}
        {{ page.date | date: date_format }}
      </time>
      {%- if page.author -%}
        <span class="post-author"> · <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">{{ page.author }}</span></span></span>
      {%- endif -%}
    </p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>

  <div class="post-end">◆</div>

  <aside class="newsletter" id="mc_embed_shell">
    <div id="mc_embed_signup">
      <form action="https://bthdonohue.us18.list-manage.com/subscribe/post?u=7d9d7e55908f21ec689870e81&amp;id=6d09686721&amp;f_id=00a628e1f0" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_self" novalidate="">
        <div id="mc_embed_signup_scroll">
          <p class="newsletter-title">Newsletter</p>
          <p class="newsletter-desc">Occasional email when new articles are posted.</p>
          <div class="newsletter-fields">
            <input type="email" placeholder="Email" name="EMAIL" class="required email" id="mce-EMAIL" required="" value="">
            <button type="submit" name="subscribe" id="mc-embedded-subscribe" class="newsletter-submit" value="Subscribe">Subscribe</button>
          </div>
          <div aria-hidden="true" style="position: absolute; left: -5000px;">
            <input type="text" name="b_7d9d7e55908f21ec689870e81_6d09686721" tabindex="-1" value="">
          </div>
        </div>
      </form>
    </div>
  </aside>
</article>
